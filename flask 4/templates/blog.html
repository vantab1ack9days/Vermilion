<!DOCTYPE html>
<html>
<head>
    <title>Блог новостей</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Блог новостей</h1>
    {% for el in news_list %}
    <div>
        <h2>{{ el.title }}</h2>
        <span>{{ el.content }}</span>
        <p>Автор: {{ el.author }}</p>
        <a href="{{ url_for('redact', id=el.id) }}">Редактировать</a>
    </div>
    {% endfor %}
</body>
</html>
